<style>
body{margin:0;background:#101722;color:#e7edf6;font:14px -apple-system,sans-serif}header{padding:16px;display:flex;justify-content:space-between;align-items:center}h2{margin:0;font-size:21px}button{background:#24344c;color:#fff;border:0;border-radius:8px;padding:8px 14px}canvas{display:block;width:480px;max-width:100%;height:640px}p{margin:0;padding:0 16px 12px;color:#9aaec7}
</style>
<header><h2>Market observatory</h2><button id="pause">Pause</button></header>
<p>12 markets · 192 depth bars · 360 live labels</p>
<canvas id="market" width="960" height="1280"></canvas>
<script>
const canvas=document.getElementById('market'),ctx=canvas.getContext('2d');
ctx.scale(2,2);
const fills=[];
for(let i=0;i<12;i++){const g=ctx.createLinearGradient(0,0,0,90);g.addColorStop(0,'#28d8b0');g.addColorStop(.45,'#2489c7');g.addColorStop(1,'#253452');fills.push(g);}
let running=true,origin=0;
function draw(t){
 ctx.fillStyle='#101722';ctx.fillRect(0,0,480,640);
 for(let panel=0;panel<12;panel++){
  const x=12+(panel%3)*156,y=12+Math.floor(panel/3)*158;
  ctx.save();ctx.translate(x,y);ctx.fillStyle='#1a2638';ctx.fillRect(0,0,144,146);
  ctx.font='bold 11px Menlo';ctx.fillStyle='#e7edf6';ctx.fillText(['ALPHA','BETA','GAMMA','DELTA'][panel%4]+' / '+(panel+1),8,17);
  ctx.fillStyle=fills[panel];
  for(let bar=0;bar<16;bar++){const h=8+Math.abs(Math.sin(t*1.3+bar*.4+panel))*54;ctx.fillRect(8+bar*8,84-h,6,h);}
  ctx.beginPath();ctx.strokeStyle='#e9bf67';ctx.lineWidth=1;
  for(let k=0;k<64;k++){const py=48+Math.sin(k*.18+t+panel)*15; if(k===0)ctx.moveTo(8,py);else ctx.lineTo(8+k*2,py);}
  ctx.stroke();ctx.font='7px Menlo';ctx.fillStyle='#9aaec7';
  for(let label=0;label<30;label++){const value=(100+panel*7+label*.17+Math.sin(t+label)*.09).toFixed(2);ctx.fillText(value,8+(label%5)*26,96+Math.floor(label/5)*9);}
  ctx.restore();
 }
}
function frame(ms){if(!origin)origin=ms;if(running)draw((ms-origin)/1000);requestAnimationFrame(frame);}
const button=document.getElementById('pause');
button.onclick=function(){running=!running;button.textContent=running?'Pause':'Resume';};
window.stress={freeze:function(){running=false;draw(1.25);button.textContent='Resume';},resume:function(){running=true;button.textContent='Pause';}};
draw(0);requestAnimationFrame(frame);
</script>
