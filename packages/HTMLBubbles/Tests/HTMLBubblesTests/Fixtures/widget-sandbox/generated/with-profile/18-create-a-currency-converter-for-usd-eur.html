<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currency Converter</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #111827; --muted: #6b7280; --line: #d1d5db; --accent: #2563eb; --soft: #dbeafe; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111827; --fg: #f3f4f6; --muted: #9ca3af; --line: #374151; --accent: #60a5fa; --soft: #1e3a8a; } }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 14px; background: var(--bg); color: var(--fg); }
  h2 { margin: 0 0 12px; font-size: 17px; }
  .row { display: grid; grid-template-columns: 1fr 90px; gap: 8px; margin-bottom: 8px; }
  input, select { padding: 9px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px; box-sizing: border-box; width: 100%; background: transparent; color: inherit; }
  .swap { text-align: center; margin: 2px 0 8px; }
  .swap button { background: var(--soft); color: var(--fg); border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 18px; cursor: pointer; }
  .rate { font-size: 13px; color: var(--muted); text-align: center; }
  details { margin-top: 12px; font-size: 13px; }
  summary { cursor: pointer; color: var(--accent); }
  .rates { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
  .rates label { font-size: 12px; color: var(--muted); }
  .rates input { padding: 6px; font-size: 14px; }
  .note { font-size: 11px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<h2>💱 Currency Converter</h2>
<div class="row"><input type="number" id="amt" value="100"><select id="from"><option>USD</option><option>EUR</option><option>GBP</option><option>JPY</option></select></div>
<div class="swap"><button id="swap" title="Swap">⇅</button></div>
<div class="row"><input type="text" id="out" readonly><select id="to"><option>USD</option><option selected>EUR</option><option>GBP</option><option>JPY</option></select></div>
<div class="rate" id="rate"></div>
<details>
  <summary>Edit rates (per 1 USD)</summary>
  <div class="rates">
    <div><label>EUR</label><input type="number" step="0.0001" data-c="EUR" id="r-eur" value="0.92"></div>
    <div><label>GBP</label><input type="number" step="0.0001" data-c="GBP" id="r-gbp" value="0.79"></div>
    <div><label>JPY</label><input type="number" step="0.01" data-c="JPY" id="r-jpy" value="149.50"></div>
  </div>
  <div class="note">Rates are indicative and edited locally — the widget has no live data.</div>
</details>
<script>
  var rates = { USD: 1, EUR: 0.92, GBP: 0.79, JPY: 149.5 };
  var $ = function (id) { return document.getElementById(id); };
  function convert() {
    var a = parseFloat($('amt').value) || 0, f = $('from').value, t = $('to').value;
    var r = rates[t] / rates[f], v = a * r;
    $('out').value = new Intl.NumberFormat(undefined, { style: 'currency', currency: t }).format(v);
    $('rate').textContent = '1 ' + f + ' = ' + r.toFixed(4) + ' ' + t;
  }
  ['amt', 'from', 'to'].forEach(function (id) { $(id).addEventListener('input', convert); $(id).addEventListener('change', convert); });
  Array.prototype.forEach.call(document.querySelectorAll('.rates input'), function (i) {
    i.addEventListener('input', function () { var v = parseFloat(i.value); if (v > 0) rates[i.getAttribute('data-c')] = v; convert(); });
  });
  $('swap').onclick = function () { var f = $('from').value; $('from').value = $('to').value; $('to').value = f; convert(); };
  convert();
</script>
</body>
</html>
