<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Programming Languages</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 16px; background: #fff; }
  h2 { font-size: 18px; margin: 0 0 4px; }
  p { font-size: 12px; color: #6b7280; margin: 0 0 12px; }
  .chart { position: relative; height: 280px; }
</style>
</head>
<body>
<h2>📊 Top 6 Programming Languages</h2>
<p>Share of developers using each language (illustrative)</p>
<div class="chart"><canvas id="c"></canvas></div>
<script>
  new Chart(document.getElementById('c'), {
    type: 'bar',
    data: {
      labels: ['JavaScript', 'Python', 'Java', 'TypeScript', 'C#', 'Go'],
      datasets: [{ label: '% of developers', data: [62, 51, 30, 38, 27, 14], backgroundColor: ['#f7df1e', '#3776ab', '#e76f00', '#3178c6', '#68217a', '#00add8'], borderRadius: 6 }]
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.x}% of developers`, afterLabel: ctx => ['Web, Node.js', 'Data science, AI', 'Enterprise, Android', 'Typed JavaScript', '.NET, Unity', 'Cloud, backend'][ctx.dataIndex] } }
      },
      scales: { x: { max: 70, ticks: { callback: v => v + '%' }, grid: { color: '#f3f4f6' } }, y: { grid: { display: false } } }
    }
  });
</script>
</body>
</html>
