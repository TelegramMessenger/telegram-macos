<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tip Calculator</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 16px; background: #ecfdf5; }
  .card { background: #fff; border-radius: 14px; padding: 20px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 14px rgba(0,0,0,.06); }
  h2 { margin: 0 0 16px; font-size: 18px; color: #065f46; }
  label { display: flex; justify-content: space-between; font-size: 14px; color: #374151; margin: 12px 0 6px; }
  input[type=number] { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #d1d5db; border-radius: 8px; }
  input[type=range] { width: 100%; accent-color: #10b981; }
  .people { display: flex; align-items: center; gap: 12px; }
  .people button { width: 36px; height: 36px; border-radius: 50%; border: none; background: #d1fae5; color: #065f46; font-size: 20px; cursor: pointer; }
  .people span { font-size: 18px; font-weight: 600; min-width: 24px; text-align: center; }
  .out { margin-top: 18px; background: #065f46; color: #fff; border-radius: 10px; padding: 14px; }
  .out div { display: flex; justify-content: space-between; padding: 4px 0; }
  .out .per { font-size: 22px; font-weight: 700; border-top: 1px solid rgba(255,255,255,.3); margin-top: 6px; padding-top: 10px; }
</style>
</head>
<body>
<div class="card">
  <h2>🧾 Tip Calculator</h2>
  <label>Bill amount</label>
  <input type="number" id="bill" value="84.50" step="0.01" min="0">
  <label>Tip <span id="tipPct">15%</span></label>
  <input type="range" id="tip" min="0" max="30" value="15">
  <label>Split between</label>
  <div class="people">
    <button id="minus">−</button><span id="people">2</span><button id="plus">+</button>
    <span style="font-size:14px;color:#6b7280;font-weight:400">people</span>
  </div>
  <div class="out">
    <div><span>Tip</span><span id="tipAmt">$0.00</span></div>
    <div><span>Total</span><span id="total">$0.00</span></div>
    <div class="per"><span>Each pays</span><span id="each">$0.00</span></div>
  </div>
</div>
<script>
  let people = 2;
  const el = id => document.getElementById(id);
  const money = n => '$' + n.toFixed(2);
  function update() {
    const bill = parseFloat(el('bill').value) || 0;
    const pct = +el('tip').value;
    el('tipPct').textContent = pct + '%';
    el('people').textContent = people;
    const tip = bill * pct / 100, total = bill + tip;
    el('tipAmt').textContent = money(tip);
    el('total').textContent = money(total);
    el('each').textContent = money(total / people);
  }
  el('bill').addEventListener('input', update);
  el('tip').addEventListener('input', update);
  el('minus').addEventListener('click', () => { if (people > 1) people--; update(); });
  el('plus').addEventListener('click', () => { if (people < 20) people++; update(); });
  update();
</script>
</body>
</html>
