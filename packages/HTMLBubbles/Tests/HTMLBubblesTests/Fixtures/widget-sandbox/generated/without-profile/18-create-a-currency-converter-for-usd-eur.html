<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currency Converter</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 16px; background: #eff6ff; }
  .card { background: #fff; border-radius: 12px; padding: 18px; max-width: 400px; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  h2 { margin: 0 0 14px; font-size: 18px; }
  .row { display: grid; grid-template-columns: 1fr 90px; gap: 8px; margin-bottom: 10px; }
  input, select { padding: 10px; font-size: 16px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; width: 100%; }
  .swap { text-align: center; margin: 2px 0 8px; }
  .swap button { background: #dbeafe; border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 18px; cursor: pointer; }
  .rate { font-size: 13px; color: #6b7280; text-align: center; }
  details { margin-top: 14px; font-size: 13px; }
  summary { cursor: pointer; color: #2563eb; }
  .rates { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .rates label { font-size: 12px; color: #6b7280; }
  .rates input { padding: 6px; font-size: 14px; }
  .updated { font-size: 11px; color: #9ca3af; margin-top: 8px; }
</style>
</head>
<body>
<div class="card">
  <h2>💱 Currency Converter</h2>
  <div class="row"><input type="number" id="amt" value="100"><select id="from"><option>USD</option><option>EUR</option><option>GBP</option><option>JPY</option></select></div>
  <div class="swap"><button id="swap">⇅</button></div>
  <div class="row"><input type="text" id="out" readonly><select id="to"><option>USD</option><option selected>EUR</option><option>GBP</option><option>JPY</option></select></div>
  <div class="rate" id="rate"></div>
  <details>
    <summary>Edit rates (per 1 USD)</summary>
    <div class="rates">
      <div><label>EUR</label><input type="number" step="0.0001" data-c="EUR" value="0.92"></div>
      <div><label>GBP</label><input type="number" step="0.0001" data-c="GBP" value="0.79"></div>
      <div><label>JPY</label><input type="number" step="0.01" data-c="JPY" value="149.50"></div>
    </div>
    <div class="updated" id="updated"></div>
  </details>
</div>
<script>
  const rates = { USD: 1, EUR: 0.92, GBP: 0.79, JPY: 149.5 };
  const symbols = { USD: '$', EUR: '€', GBP: '£', JPY: '¥' };
  const $ = id => document.getElementById(id);
  function convert() {
    const a = parseFloat($('amt').value) || 0, f = $('from').value, t = $('to').value;
    const r = rates[t] / rates[f];
    const v = a * r;
    $('out').value = symbols[t] + v.toLocaleString(undefined, { minimumFractionDigits: t === 'JPY' ? 0 : 2, maximumFractionDigits: t === 'JPY' ? 0 : 2 });
    $('rate').textContent = `1 ${f} = ${r.toFixed(4)} ${t}`;
  }
  ['amt', 'from', 'to'].forEach(id => $(id).addEventListener('input', convert));
  document.querySelectorAll('.rates input').forEach(i => i.addEventListener('input', () => { rates[i.dataset.c] = parseFloat(i.value) || rates[i.dataset.c]; $('updated').textContent = 'Rates edited ' + new Date().toLocaleTimeString(); convert(); }));
  $('swap').onclick = () => { const f = $('from').value; $('from').value = $('to').value; $('to').value = f; convert(); };
  // Try to refresh rates from a public API; fall back to the built-in values if offline.
  fetch('https://api.exchangerate.host/latest?base=USD&symbols=EUR,GBP,JPY').then(r => r.json()).then(d => {
    if (d && d.rates) { Object.assign(rates, d.rates); document.querySelectorAll('.rates input').forEach(i => i.value = rates[i.dataset.c]); $('updated').textContent = 'Live rates loaded'; convert(); }
  }).catch(() => { $('updated').textContent = 'Using built-in rates (offline)'; });
  convert();
</script>
</body>
</html>
