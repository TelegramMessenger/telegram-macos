<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Budget</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 16px; background: #fff; color: #111; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  .wrap { position: relative; width: 100%; max-width: 420px; margin: 0 auto; }
  .total { text-align: center; font-size: 14px; color: #555; margin-top: 10px; }
  .total b { color: #111; font-size: 18px; }
</style>
</head>
<body>
<h2>💰 Weekly Budget</h2>
<div class="wrap"><canvas id="budget"></canvas></div>
<div class="total">Total: <b>$2,450</b> / week</div>
<script>
  const data = { Rent: 1200, Groceries: 450, Transport: 180, Entertainment: 220, Savings: 400 };
  new Chart(document.getElementById('budget'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(data),
      datasets: [{ data: Object.values(data), backgroundColor: ['#6366f1', '#22c55e', '#f59e0b', '#ec4899', '#06b6d4'], borderWidth: 2 }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'bottom' },
        tooltip: { callbacks: { label: (ctx) => ` $${ctx.parsed} (${Math.round(ctx.parsed / 2450 * 100)}%)` } }
      }
    }
  });
</script>
</body>
</html>
