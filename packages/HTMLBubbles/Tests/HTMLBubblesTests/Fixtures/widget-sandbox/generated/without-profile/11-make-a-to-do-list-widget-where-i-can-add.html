<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 16px; background: #fffbeb; }
  .app { background: #fff; border-radius: 12px; padding: 16px; max-width: 400px; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  h2 { margin: 0 0 12px; font-size: 18px; }
  form { display: flex; gap: 8px; margin-bottom: 12px; }
  input[type=text] { flex: 1; padding: 10px; font-size: 15px; border: 1px solid #d1d5db; border-radius: 8px; }
  button.add { padding: 10px 14px; background: #f59e0b; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 6px; border-bottom: 1px solid #f3f4f6; }
  li.done span { text-decoration: line-through; color: #9ca3af; }
  li span { flex: 1; font-size: 15px; }
  li input[type=checkbox] { width: 18px; height: 18px; accent-color: #f59e0b; }
  li button { background: none; border: none; color: #ef4444; font-size: 18px; cursor: pointer; opacity: .6; }
  li button:hover { opacity: 1; }
  .empty { text-align: center; color: #9ca3af; padding: 16px; font-size: 14px; }
  .footer { font-size: 12px; color: #6b7280; margin-top: 10px; display: flex; justify-content: space-between; }
  .footer a { color: #6b7280; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <h2>✅ To-Do</h2>
  <form id="f"><input type="text" id="txt" placeholder="Add a task…" autocomplete="off"><button class="add" type="submit">Add</button></form>
  <ul id="list"></ul>
  <div class="footer"><span id="count"></span><a id="clear">Clear completed</a></div>
</div>
<script>
  let todos = JSON.parse(localStorage.getItem('todos') || 'null') || [
    { text: 'Buy groceries', done: false },
    { text: 'Call the dentist', done: true },
    { text: 'Finish the report', done: false },
  ];
  const list = document.getElementById('list');
  function save() { localStorage.setItem('todos', JSON.stringify(todos)); }
  function render() {
    list.innerHTML = '';
    if (!todos.length) list.innerHTML = '<li class="empty">Nothing to do 🎉</li>';
    todos.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = t.done ? 'done' : '';
      li.innerHTML = `<input type="checkbox" ${t.done ? 'checked' : ''}><span></span><button title="Delete">×</button>`;
      li.querySelector('span').textContent = t.text;
      li.querySelector('input').onchange = e => { t.done = e.target.checked; save(); render(); };
      li.querySelector('button').onclick = () => { if (confirm('Delete "' + t.text + '"?')) { todos.splice(i, 1); save(); render(); } };
      list.appendChild(li);
    });
    const left = todos.filter(t => !t.done).length;
    document.getElementById('count').textContent = `${left} item${left === 1 ? '' : 's'} left`;
  }
  document.getElementById('f').onsubmit = e => {
    e.preventDefault();
    const v = document.getElementById('txt').value.trim();
    if (!v) return;
    todos.push({ text: v, done: false });
    document.getElementById('txt').value = '';
    save(); render();
  };
  document.getElementById('clear').onclick = () => { todos = todos.filter(t => !t.done); save(); render(); };
  render();
</script>
</body>
</html>
