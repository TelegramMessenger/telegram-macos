<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pancake Recipe</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 16px; background: #fff7ed; color: #1f2937; }
  .card { background: #fff; border-radius: 14px; overflow: hidden; max-width: 400px; margin: 0 auto; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .hero { height: 120px; background: url('https://images.unsplash.com/photo-1528207776546-365bb710ee93?w=800') center/cover; display: flex; align-items: flex-end; padding: 12px; color: #fff; font-size: 22px; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .body { padding: 16px; }
  h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .5px; color: #9a3412; margin: 14px 0 8px; }
  .ing label { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 14px; cursor: pointer; }
  .ing input { width: 18px; height: 18px; accent-color: #ea580c; }
  .ing label.checked { text-decoration: line-through; color: #9ca3af; }
  .step { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #fed7aa; font-size: 14px; }
  .step .n { width: 26px; height: 26px; border-radius: 50%; background: #ea580c; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; font-size: 13px; }
  .step .t { flex: 1; }
  .timer { margin-top: 6px; display: inline-flex; align-items: center; gap: 8px; }
  .timer button { padding: 4px 10px; border: 1px solid #ea580c; background: #fff; color: #ea580c; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .timer button.running { background: #ea580c; color: #fff; }
  .timer span { font-family: ui-monospace, monospace; font-size: 13px; }
  .meta { font-size: 12px; color: #6b7280; }
</style>
</head>
<body>
<div class="card">
  <div class="hero">🥞 Fluffy Pancakes</div>
  <div class="body">
    <div class="meta">⏱ 25 min · 🍽 Serves 4 · 🔥 Easy</div>
    <h3>Ingredients</h3>
    <div class="ing" id="ing"></div>
    <h3>Steps</h3>
    <div id="steps"></div>
  </div>
</div>
<script>
  const ingredients = ['1½ cups all-purpose flour', '3½ tsp baking powder', '1 tbsp sugar', '¼ tsp salt', '1¼ cups milk', '1 egg', '3 tbsp melted butter'];
  const steps = [
    { t: 'Whisk flour, baking powder, sugar and salt in a large bowl.', m: 0 },
    { t: 'Add milk, egg and melted butter; stir until just combined (lumps are fine).', m: 0 },
    { t: 'Let the batter rest.', m: 5 },
    { t: 'Heat a lightly oiled pan over medium heat.', m: 2 },
    { t: 'Pour ¼ cup batter per pancake; cook until bubbles form, then flip.', m: 2 },
    { t: 'Cook the other side until golden. Repeat with remaining batter.', m: 1 },
  ];
  document.getElementById('ing').innerHTML = ingredients.map(i => `<label><input type="checkbox"> ${i}</label>`).join('');
  document.querySelectorAll('.ing input').forEach(c => c.onchange = () => c.parentElement.classList.toggle('checked', c.checked));
  document.getElementById('steps').innerHTML = steps.map((s, i) => `<div class="step"><div class="n">${i + 1}</div><div class="t">${s.t}${s.m ? `<div class="timer"><button data-m="${s.m}">▶ ${s.m} min</button><span></span></div>` : ''}</div></div>`).join('');
  document.querySelectorAll('.timer button').forEach(b => {
    let left = 0, iv = null; const out = b.nextElementSibling;
    b.onclick = () => {
      if (iv) { clearInterval(iv); iv = null; b.classList.remove('running'); b.textContent = `▶ ${b.dataset.m} min`; out.textContent = ''; return; }
      left = b.dataset.m * 60; b.classList.add('running'); b.textContent = '■ Stop';
      const show = () => out.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
      show();
      iv = setInterval(() => { left--; show(); if (left <= 0) { clearInterval(iv); iv = null; b.classList.remove('running'); b.textContent = '✓ Done'; out.textContent = ''; } }, 1000);
    };
  });
</script>
</body>
</html>
