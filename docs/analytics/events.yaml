events:
  app.launch:
    description: The app finished launching and showed its first screen.
    params:
      start:
        type: enum
        values: [cold, warm]
      duration_ms:

  app.foreground:
    description: The app became active. Starts a new session_id.

  app.background:
    description: The app stopped being active.
    params:
      duration_ms:
        description: Time since the matching app.foreground.

  screen.show:
    description: A screen became visible. Sent automatically by the navigation layer.
    params:
      screen:
        required: true
      source:
      peer_type:
        description: Only for screens that list peer_type.

  screen.hide:
    description: A screen stopped being visible.
    params:
      screen:
        required: true
      duration_ms:

  menu.open:
    description: A context or action menu was opened.
    params:
      menu:
        required: true
      screen:
      via:

  menu.select:
    description: An item in a menu was chosen.
    params:
      menu:
        required: true
      item:
        required: true
      screen:

  flow.end:
    description: >
      One finished journey through a flow from `flows`. Steps are collected locally while
      the flow runs and sent once, when it ends.
    params:
      flow:
        type: flow_id
        required: true
      outcome:
        type: flow_outcome
        required: true
      steps:
        type: step_list
        required: true
        description: >
          Up to 50 steps in order, as [step_id, ms_since_flow_start] pairs, e.g.
          [["change_title", 2100], ["open_permissions", 5400]]. Steps are ids from the flow's `steps`; never values.
      step_count:
        type: int
        required: true
        description: Total steps, including any dropped past the 50 cap.
      duration_ms:
        required: true
      source:

  chat_list.folder.select:
    description: The user switched the chat list to another folder.
    params:
      folder_kind:
        type: enum
        values: [all_chats, custom]
      via:

  chat.message.send:
    description: The user's submission was fully accepted into the local outgoing queue. This does not prove server delivery. Albums count as one event.
    params:
      kind:
        type: message_kind
        required: true
      peer_type:
      has_reply:
        type: bool
      scheduled:
        type: bool
      silent:
        type: bool

  chat.message.forward:
    description: The user forwarded messages.
    params:
      count:
        description: Number of messages.
      target_count:
        type: count
        description: Number of chats forwarded to.

  chat.message.edit:
    params:
      kind:
        type: message_kind

  chat.message.delete:
    params:
      count:
      for_everyone:
        type: bool

  chat.message.react:
    params:
      reaction_kind:
        type: enum
        values: [emoji, custom_emoji, paid]
      via:

  chat.message.translate: {}

  chat.attach.open:
    description: The attachment picker was opened, however the platform presents it.
    params:
      peer_type:
      via:

  chat.attach.select:
    params:
      kind:
        type: enum
        values: [photo_video, camera, file, location, poll, checklist, contact, gift, mini_app]

  chat.search.open:
    description: Search inside a chat was opened.
    params:
      via:

  search.result.select:
    description: The user opened a result from global search.
    params:
      result_kind:
        type: enum
        values: [recent, chat, message, media, link, file, music, voice, global_peer, global_post]

  chat.saved_tag.edit.select:
    description: >
      An eligible Saved Messages tag edit command was selected from a message reaction menu,
      a search-tag menu or an accessibility action. This is intent, not editor readiness,
      local persistence or server success. No label, reaction, custom emoji or message identifiers.
      Menu creation, rendering, input changes and save feedback are not edit selections.
      The accessibility entry describes the invoked API, not a user's identity or abilities.
    params:
      entry:
        type: enum
        values: [reaction_menu, search_tag_menu, accessibility]
        required: true

  peer_info.recommendation.select:
    description: >
      An eligible channel or bot recommendation-list callback selected a peer or the Premium entry.
      This is intent, not chat readiness, joining, starting a bot or purchasing. No peer identifiers,
      recommendation contents, ranking or input modality. Rendering and refreshes are not selections.
    params:
      kind:
        type: enum
        values: [channel, bot]
        required: true
      selection:
        type: enum
        values: [peer, premium]
        required: true

  stories.view:
    description: The user viewed a story for at least one second.
    params:
      owner:
        type: enum
        values: [self, other]
      peer_type:

  stories.react: {}

  stories.reply: {}

  call.start:
    params:
      video:
        type: bool

  call.accept:
    params:
      video:
        type: bool

  call.decline: {}

  call.end:
    params:
      duration:
        type: call_duration
      video:
        type: bool
      reason:
        type: enum
        values: [hangup, missed, busy, failed, disconnected]

  group_call.join:
    params:
      kind:
        type: enum
        values: [voice_chat, live_stream, conference]

  group_call.leave:
    params:
      duration:
        type: call_duration

  settings.change:
