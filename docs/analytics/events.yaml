flow_outcomes:
  success: The user finished the task (saved, created, sent)
  cancelled: The user explicitly cancelled or discarded changes
  abandoned: The screen was closed without finishing or cancelling
  fail: The task ended with an error
  interrupted: The app quit or crashed during the flow; sent on the next launch

flows:
  chat.media_edit:
    since: 1
    platforms: [macos]
    description: A media replacement task inside an existing message edit. Preserve the first acquisition route and bounded later replacements. Local draft application is not success; success requires an applied edit result. Unconfirmed results, stale sessions and privacy revocation discard silently. No message identifiers, paths or media content are collected.
    timing_resolution_ms: 1000
    params:
      entry_point:
        type: enum
        values: [clipboard, drop_target, replacement_picker, attachment, photo_editor]
        required: true
      media_mode:
        type: enum
        values: [media, file]
        required: true
      replacement_count:
        type: bucket
        values: ["0", "1", "2_3", "4_plus"]
        required: true
      retry_count:
        type: bucket
        values: ["0", "1", "2_3", "4_plus"]
        required: true
      scheduled:
        type: bool
      last_blocker:
        type: enum
        values: [preparation, caption_limit, permission, request_failed, size_limit, file_unavailable, empty_selection]
    steps: [paste, drop, open_picker, attach, open_editor, supersede_replacement, apply_replacement, cancel_selection, cancel_editor, blocked, retry, submit, cancel_submission, supersede_submission, applied, rejected, cancel]
  chat.share:
    since: 1
    platforms: [macos]
    description: One deliberate share task from an audited source route through optional source lookup and recipient picker. Success means every requested part was locally accepted, never remote delivery. Unknown acceptance is distinct from rejection; cancellation means observed picker closure, not proof that an in-flight send was undone. Observed picker blockers retain only the last categorical reason; retries after blockers or explicit payment cancellation use capped buckets. Unknown payment dismissal, teardown, superseded submissions and privacy revocation discard silently. No message, contact, chat or recipient identifiers, prices or content are collected.
    timing_resolution_ms: 1000
    params:
      entry_point:
        type: enum
        values: [message_action, album_action, profile_contact, gallery_selection, gallery_group]
        required: true
      retry_count:
        type: bucket
        values: ["0", "1", "2_3", "4_plus"]
        required: true
      last_blocker:
        type: enum
        values: [premium_required, slow_mode_wait, slow_mode_comment, pending_messages, insufficient_balance]
      result:
        type: enum
        values: [accepted, partially_accepted, rejected, acceptance_unknown, source_unavailable]
        outcomes: [success, fail]
    steps: [request, source_ready, source_unavailable, open_picker, blocked, retry, open_payment_confirmation, confirm_payment, cancel_payment_confirmation, open_top_up, submit, accepted, partially_accepted, rejected, acceptance_unknown, cancel]
  chat.forward_picker:
    since: 1
    platforms: [macos]
    description: One forwarding task from an explicit client route. Selected-message actions can include source lookup, identified by source_lookup; other routes begin at picker construction with available messages. An observed empty source lookup fails before opening a picker. Report-mode actions are excluded. Legacy handoffs can discard the source phase and begin a separate picker-only observation, so compare source_lookup strata separately. Search usage is a Boolean, with at most one search step; navigation records requested forum/community openings and return actions, not successful loading. Draft preparation, destination readiness and local enqueue acceptance are distinct; none proves remote delivery. Explicit closure records a cancellation request, not reversal of accepted content. Premium and poll restrictions or operational errors permit bounded retry observation. Unknown teardown and privacy revocation discard silently. No identifiers, message content, comments, queries or raw errors are collected. Optional client routes are not proof of human intent.
    timing_resolution_ms: 1000
    params:
      entry_point:
        type: enum
        values: [message_selection, message_menu, more_menu, replacement_menu, row_action]
        required: true
      destination:
        type: enum
        values: [chat, topic]
      search_used:
        type: bool
        required: true
      source_lookup:
        type: bool
        required: true
      source_coverage:
        type: enum
        values: [complete, partial, unexpected]
      activation:
        type: enum
        values: [row_action, return_key, number_shortcut, saved_messages_shortcut, send_button, send_menu]
      retry_count:
        type: bucket
        values: ["0", "1", "2_3", "4_plus"]
        required: true
      last_blocker:
        type: enum
        values: [premium_required, poll_restriction, operation_failed]
      result:
        type: enum
        values: [draft_prepared, destination_ready, accepted, partially_accepted, rejected, acceptance_unknown, source_unavailable, target_unavailable]
        outcomes: [success, fail]
    steps: [lookup_source, source_ready, open_picker, search, open_forum, open_community, back, choose_chat, choose_topic, blocked, retry, draft_prepared, destination_ready, accepted, partially_accepted, rejected, acceptance_unknown, source_unavailable, target_unavailable, cancel]
  chat.quick_forward:
    since: 1
    platforms: [macos]
    description: A chosen quick-forward target from a message menu. Menu construction is not intent. A directly updated draft in an existing chat, readiness of a new/topic destination with a queued initial action, and local enqueue acceptance in Saved Messages are distinct. Readiness does not prove draft application, and none proves remote delivery. Metadata failure, restrictions and unknown acceptance remain separate. Supersession, teardown and missing callbacks discard silently. No message, peer, topic or menu-title data are collected, and client actions do not prove human intent.
    timing_resolution_ms: 1000
    params:
      entry_point:
        type: enum
        values: [direct_target, topic_target]
        required: true
      result:
        type: enum
        values: [draft_prepared, destination_ready, accepted, partially_accepted, rejected, acceptance_unknown, source_unavailable, target_unavailable, restricted, completion_unknown, operation_failed]
        outcomes: [success, fail]
    steps: [request, draft_prepared, destination_ready, accepted, partially_accepted, rejected, acceptance_unknown, source_unavailable, target_unavailable, restricted, completion_unknown, operation_failed]
  peer_info.share_own_contact:
    since: 1
    platforms: [macos]
    description: An explicit profile action to share the signed-in user's contact with that profile peer, through metadata, confirmation and local enqueue. Distinct from choosing destinations in a contact picker. Cancellation requires an explicit dialog callback; unexplained dismissal, replacement and owner loss discard silently. Missing metadata is distinct from rejected or unknown local acceptance. No names, phone numbers, contact data or peer identifiers are collected. This client action does not prove human intent.
    timing_resolution_ms: 1000
    params:
      result:
        type: enum
        values: [target_unavailable, source_unavailable, accepted, rejected, acceptance_unknown]
        outcomes: [success, fail]
    steps: [request, target_ready, target_unavailable, open_confirmation, confirm, cancel, source_ready, source_unavailable, submit, accepted, rejected, acceptance_unknown]
  bot.prepared_share:
    since: 1
    platforms: [macos]
    description: One mini-app prepared-message request from metadata lookup through preview and recipient picker. The request may be automated and does not prove human intent. Success means observed local enqueue acceptance, never delivery. Typed picker results distinguish cancellation, rejection, partial local acceptance and unknown acceptance. Legacy Boolean callbacks retain not_accepted when they cannot distinguish these. Explicit preview cancellation is separate. Missing callbacks, page replacement, teardown and privacy revocation discard silently. No bot, message, recipient or request identifiers are collected.
    timing_resolution_ms: 1000
    params:
      entry_point:
        type: enum
        values: [mini_app_request]
        required: true
      result:
        type: enum
        values: [accepted, partially_accepted, rejected, acceptance_unknown, not_accepted, metadata_unavailable]
        outcomes: [success, fail]
    steps: [request, metadata_ready, open_preview, open_picker, accepted, partially_accepted, rejected, acceptance_unknown, not_accepted, metadata_unavailable, cancel_preview, cancel_picker]
  stickers.edit:
    since: 1
    platforms: [macos]
    description: One deliberate sticker creation or pack-edit task, preserving acquisition and recovery before the observed result. A send succeeds only on local enqueue acceptance. Missing callbacks and privacy revocation discard silently; no content, titles, emoji or pack identifiers are collected.
    timing_resolution_ms: 1000
    params:
      entry_point:
        type: enum
        values: [composer_create, pack_add_image, pack_add_existing, pack_replace, pack_rename]
        required: true
      via:
      destination:
        type: enum
        values: [send, favorites, new_pack, existing_pack, replacement, rename]
      image_mode:
        type: enum
        values: [cutout, whole_image]
      retry_count:
        type: bucket
        values: ["0", "1", "2_3", "4_plus"]
        required: true
      scheduled:
        type: bool
      silent:
        type: bool
      last_blocker:
        type: enum
        values: [image_unreadable, preparation, empty_name, pack_limit, favorites_limit, request_failed, chat_permission, slow_mode, payment_required, enqueue_rejected]
    steps: [attempt, open_image_picker, image_selected, open_editor, apply_editor, prepared, open_sticker_picker, sticker_selected, choose_destination, open_name, accept_name, cancel_name, blocked, retry, prepare_send, open_schedule, cancel_schedule, open_confirmation, cancel_confirmation, submit, accepted, rejected, cancel]
  chat.recording:
    since: 1
    platforms: [macos]
    description: One deliberate recording attempt including review and transcription. Success is an observed media/text enqueue or text insertion into a draft, distinguished by result. Missing callbacks and privacy revocation discard silently.
    timing_resolution_ms: 1000
    params:
      recording_kind:
        type: enum
        values: [voice, video]
        required: true
      surface:
        type: enum
        values: [chat, story_reply]
        required: true
      initial_mode:
        type: enum
        values: [hold, locked]
        required: true
      via:
      submit_via:
        type: enum
        values: [release, send_control, keyboard, duration_limit, unknown]
      scheduled:
        type: bool
      one_time:
        type: bool
      last_blocker:
        type: enum
        values: [permission, chat_permission, slow_mode, preparation, enqueue_rejected]
      result:
        type: enum
        values: [media_accepted, text_accepted, text_partially_accepted, draft_inserted, rejected]
        outcomes: [success, fail]
    steps: [attempt, permission_granted, permission_denied, start, lock, pause, review, trim, resume, one_time_on, one_time_off, open_confirmation, cancel_confirmation, open_schedule, cancel_schedule, blocked, transcribe, prepare_submission, submit, accepted, partially_accepted, rejected, draft_inserted, cancel]
  chat.media_compose:
    since: 1
    platforms: [macos]
    description: One media task from acquisition to explicit dismissal or acknowledged local enqueue. Success means every submission part was locally accepted, never remote delivery. Missing results and privacy revocation discard the task silently. Add-paste/drop unchanged steps describe nonempty preview additions whose normalized selection did not change; they do not imply a send failure or retry.
    timing_resolution_ms: 1000
    params:
      entry_point:
        type: enum
        values: [attach_file, attach_photo_video, image_picker, clipboard, drop_target, unknown]
        required: true
      via:
      media_mode:
        type: enum
        values: [media, file, archive, mixed]
        required: true
      attachment_count:
        type: bucket
        values: ["0", "1", "2_5", "6_20", "21_100", "101_plus"]
        required: true
      submit_via:
        type: enum
        values: [send_control, enter, cmd_enter, send_menu, direct, unknown]
      scheduled:
        type: bool
      silent:
        type: bool
      last_blocker:
        type: enum
        values: [empty_selection, size_limit, unsupported_format, permission, preparation, slow_mode, caption_limit, missing_files, file_unavailable, enqueue_rejected]
      retry_count:
        type: bucket
        values: ["0", "1", "2_3", "4_plus"]
        required: true
      submission_result:
        type: enum
        values: [accepted, partially_accepted, rejected]
        outcomes: [success, fail]
    steps: [acquire, acquired, prepare, preview, add_paste, add_drop, add_picker, add_paste_unchanged, add_drop_unchanged, remove_media, reorder_media, open_cover_picker, cancel_cover_picker, apply_cover, remove_cover, open_price, apply_price, cancel_price, remove_price, open_effect_premium, open_editor, apply_editor, cancel_editor, select_media, select_file, select_archive, select_grouped, select_ungrouped, toggle_spoiler, open_schedule, cancel_schedule, open_confirmation, cancel_confirmation, blocked, retry, submit, accepted, partially_accepted, rejected, cancel, close]
  peer_info.manage:
    description: Editing a group or channel from its edit screen, until it is saved or closed.
    screen: peer_info.manage
    steps: [change_photo, remove_photo, change_title, change_description, change_type, change_username, toggle_sign_messages, toggle_history_visible, toggle_forum, toggle_join_requests, open_permissions, open_admins, open_members, open_invite_links, open_reactions, open_slow_mode, open_linked_chat, open_color, open_stickers, delete]
  peer_info.visibility:
    description: Changing whether a group or channel is public or private, its usernames, links, who can write and content protection; from opening the screen until Done succeeds or the screen is closed.
    screen: peer_info.visibility
    params:
      peer_type:
        description: channel or group.
        values: [channel, group]
      entry:
        type: enum
        values: [create, edit]
      initial:
        type: enum
        values: [public, private]
      result:
        type: enum
        description: Only with outcome success.
        values: [public, private]
        outcomes: [success]
    steps: [select_public, select_private, edit_username, username_available, username_purchase_available, username_taken, username_invalid, revoke_other_public_link, toggle_extra_username, reorder_usernames, copy_link, share_link, open_link, revoke_link, manage_links, set_write_everyone, set_write_members, toggle_approve_members, toggle_restrict_forwarding, save, save_failed_limit, save_failed]
  create.group:
    description: Creating a group, from opening the screen until the group exists or the user gives up.
    screen: create.group
    steps: [add_member, remove_member, search_members, change_title, change_photo, set_auto_delete]
  settings.privacy.rule:
    description: Changing one privacy rule (last seen, phone number, etc.), from opening its settings.privacy.<rule> screen until it is closed.
    steps: [select_everybody, select_contacts, select_nobody, open_always_allow, open_never_allow, add_exception, remove_exception]
    params:
