    params:
      setting:
        type: setting_id
        required: true
      value:
        type: setting_value
        required: true

  bot.mini_app.open:
    params:
      entry:
        type: enum
        values: [menu_button, attach, inline_button, link, main_app, side_menu]

  link.open:
    params:
      link_kind:
        type: enum
        values: [peer, message, invite, stickers, theme, proxy, mini_app, external, other]

  stars.purchase.success:
    params:
      stars:
        type: bucket
        values: [under_100, "100_999", "1000_9999", "10000_plus"]

  shortcut.use:
    platforms: [macos, tdesktop, web]
    params:
      shortcut:
        type: enum
        values: [global_search, chat_search, next_chat, previous_chat, next_unread_chat, edit_last_message, reply, settings, lock]

