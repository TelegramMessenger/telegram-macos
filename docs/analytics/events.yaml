# Telegram App Events registry. Rules: RULES.md
schema_version: 1

platforms: [macos, ios, android, tdesktop, web]

# An entry without `platforms` is part of the core and expected on every platform.

sections:
  app: App lifecycle
  screen: Generic screen visibility
  menu: Generic context and action menus
  flow: Step-by-step journeys through one task, sent as one event
  chat_list: Chat list, folders, archive
  news: Recommended and added news feeds
  chat: An open chat, its input and its messages
  search: Global search
  contacts: Contacts list
  peer_info: Profile of a user, bot, group or channel
  settings: App and account settings
  stories: Stories
  media_viewer: Full-screen photo and video viewer
  call: One-to-one calls
  group_call: Voice chats, live streams, conference calls
  premium: Telegram Premium
  stars: Telegram Stars
  gifts: Gifts
  wallet: Wallet
  bot: Bots and mini apps
  link: Opening t.me and external links
  share: Forwarding and sharing to chats
  create: Creating groups, channels, secret chats
  stickers: Sticker and emoji sets
  shortcut: Keyboard shortcuts
  auth: Login and signup
  passcode: Local passcode lock
  community: Communities, groups of chats
  affiliate: Bot affiliate programs
  boosts: Boosting groups and channels, giveaways
  payments: Bot payments and checkout
  passport: Telegram Passport
  report: Reporting content
  export: Exporting chat history and account data
  media_editor: Editing photos, drawings and avatars
  media_player: Music and audio playback
  instant_view: Instant View articles
  browser: In-app web browser
  system: Operating system pickers and panels
  ton: TON balance in Telegram

actions:
  show: A screen became visible
  hide: A screen stopped being visible
  open: The user opened something that is not a screen (a menu, a picker, a link)
  close: The user closed something that is not a screen
  select: The user picked one option among several
  change: A setting or mode changed value
  send: Something was sent
  start: A process began
  end: A process finished, whatever the outcome
  success: A process finished successfully
  fail: A process finished with an error
  cancel: The user abandoned a process
  join: The user joined something
  leave: The user left something
  accept: The user accepted an incoming request
  decline: The user declined an incoming request
  view: The user viewed content that is not a screen
  react: The user added a reaction
  reply: The user replied
  forward: The user forwarded
  edit: The user edited
  delete: The user deleted
  translate: The user translated
  use: The user used a tool or shortcut
  launch: The app started
  foreground: The app became active
  background: The app stopped being active

glossary:
  folder:
    meaning: A chat list folder.
    avoid: [filter, dialog_filter, tab]
  archive:
    meaning: The archived chats list.
  chat:
    meaning: Any conversation with a user, bot, group or channel.
    avoid: [dialog, conversation]
  thread:
    meaning: Replies to one message, including channel comments.
    avoid: [replies, comments]
  forum_topic:
    meaning: A topic in a forum group.
  peer_info:
    meaning: The profile screen of a user, bot, group or channel.
    avoid: [user_info, chat_info]
  saved_messages:
    meaning: The chat with yourself.
  story:
    meaning: A story.
    avoid: [moment]
  mini_app:
    meaning: A bot web app.
    avoid: [web_app, web_view, webapp]
  visibility:
    meaning: Whether a group or channel is public (has a username) or private (invite link only), plus who can write and whether content can be saved.
    avoid: [channel_type, privacy_type]
  inline_button:
    meaning: A button attached to a message (inline keyboard), a product concept rather than a UI widget.
  quick_replies:
    meaning: Telegram Business saved replies sent with a shortcut.
  media_composer:
    meaning: The screen where attached media is previewed and captioned before sending.
    avoid: [preview_sender]

common_params:
  platform:
    type: enum
    values: [macos, ios, android, tdesktop, web]
  app_version:
    type: string
    description: Marketing version, e.g. 11.12.
  build:
    type: string
    description: Build number.
  schema_version:
    type: int
  session_id:
    type: string
    description: Random UUID, new on every app.foreground.
  seq:
    type: int
    description: 0-based order of the event within the session.
  layout:
    type: enum
    values: [compact, regular, wide]

params:
  screen:
    type: screen_id
    description: Id from `screens`.
  source:
    type: screen_id
    description: The screen that was visible before. Filled in automatically by the analytics layer.
  menu:
    type: menu_id
    description: Id from `menus`.
  item:
    type: menu_item
    description: Item id from the `items` of the menu in `menu`.
  via:
    type: enum
    description: How the user triggered the action.
    values: [click, tap, right_click, long_press, shortcut, swipe, drag_drop, other]
  peer_type:
    type: enum
    values: [user, bot, group, channel, forum, saved_messages, secret_chat]
  duration_ms:
    type: ms
  count:
    type: bucket
    values: ["1", "2_5", "6_20", "21_100", "101_plus"]
  message_kind:
    type: enum
    values: [text, photo, video, album, file, music, voice, video_message, sticker, gif, poll, checklist, location, live_location, contact, dice]
  call_duration:
    type: bucket
    values: [under_10s, 10s_1m, 1m_5m, 5m_30m, 30m_plus]

