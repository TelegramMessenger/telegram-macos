platform: macos

ignore_reasons:
  base: "Abstract or generic base class; the concrete screens are mapped"
  container: "Hosts other screens and has no content of its own"
  embedded: "Part of another screen, never shown on its own"
  placeholder: "Stub used until the real implementation is installed"
  lab: "Developer lab or debug-only screen"
  transient: "Toast, progress indicator, tooltip, menu, or a quick bar or overlay attached to an item; a picker the user opens on purpose is a screen"
  helper: "Window or object that only supports another screen (animation, overlay host)"
  dead_code: "Not used"

